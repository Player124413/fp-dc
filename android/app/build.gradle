plugins {
    id 'com.android.application'
}

// An update must never look like a downgrade: the CI run number when there is one, else
// -PfpVersionCode=..., else 1 for a local build. (A plain `versionCode a ?: b` does not parse: Groovy
// reads it as a method call.)
def fpVersionCode = ((project.findProperty('fpVersionCode') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '1')).toString().toInteger()

// D-136: tables/story/scripts/*.scn -> assets/story/*.scn. 10 MB of text, ~1.5 MB in the APK once deflated; the asset
// copy is what the game loads, so a scene-script fix never waits for a new data pack again.
def storyAssets = tasks.register('storyAssets', Copy) {
    from("${rootProject.projectDir}/../tables/story/scripts") { include '*.scn' }
    into layout.buildDirectory.dir('storyAssets/story')
}
// Whatever consumes the assets (the merge tasks) and whatever runs first (preBuild) needs the copy in place.
tasks.configureEach { t ->
    if (t.name == 'preBuild' || (t.name.startsWith('merge') && t.name.endsWith('Assets')))
        t.dependsOn storyAssets
}

android {
    namespace 'com.fpdc.port'
    compileSdk 34
    // any r26/r27 works; CMake 3.22+ ships with the SDK. -PfpNdk=<version> overrides it (CI does when
    // the pinned one is not installed).
    ndkVersion project.findProperty('fpNdk') ?: '26.1.10909125'

    signingConfigs {
        // One key for every build, committed on purpose: Android refuses to update an installed app
        // when the signature changes ("app not installed"), so a fresh APK would need an uninstall
        // first. This is a sideload key, not a store identity -- it is public by design.
        fpdc {
            storeFile file('../keystore/fpdc.p12')
            storeType 'PKCS12'
            storePassword 'fpdc-android'
            keyAlias 'fpdc'
            keyPassword 'fpdc-android'
        }
    }

    defaultConfig {
        applicationId 'com.fpdc.port'
        minSdk 26                       // AAudio (the low-latency output) starts at API 26
        targetSdk 34
        versionCode fpVersionCode
        versionName '1.1'
        ndk {
            // 64-bit first (every phone since 2019); armeabi-v7a for older ones; x86_64 for emulators
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                // FP_VERSION_CODE lands in the library: CHECK FOR UPDATES compares it with the
                // newest successful CI run (see src/platform/android/plat_android.c)
                arguments '-DANDROID_STL=none', '-DCMAKE_BUILD_TYPE=Release', "-DFP_VERSION_CODE=${fpVersionCode}"
                cFlags '-O3 -ffp-contract=off'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false        // no Java to shrink; the game is native
            jniDebuggable false
            debuggable false
            // the same key as the debug build: either APK updates the other, no uninstall needed
            signingConfig signingConfigs.fpdc
        }
        debug {
            jniDebuggable true
            signingConfig signingConfigs.fpdc
        }
    }

    packagingOptions {
        // Keep the symbols of the 64-bit native library in the APK: a native crash writes addresses,
        // and <module>+<offset> only becomes a function name when the .so of the same build has its
        // symbol table (see the crash handler in plat_android.c). Gradle strips every other ABI, so the
        // APK grows only by this one (about 3-4 MB).
        jniLibs {
            keepDebugSymbols.add('**/arm64-v8a/libfpdc.so')
        }
    }

    // D-136: the Adventure scene scripts are the build's own data (tables/story/scripts/*.scn), not the user's: the
    // pack carries them too, but a pack imported before a script fix kept playing the old script, and a scene stayed
    // black over several APKs because the fix lived in the pack. They are copied into the APK's assets/story/ by the
    // storyAssets task below and plat_android.c reads them from there first. Everything else still comes from the
    // imported data (see FpActivity).
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('storyAssets'))

    // the game data is imported at run time (see FpActivity), so nothing large ships in the APK
    buildFeatures {
        buildConfig false
    }
    lint {
        abortOnError false
    }
}

