name: Convert game data

# Turns a game data archive into something the ports can use, without a PC setup:
#   * "dc"      -> fpdc.cdi, a Dreamcast disc image (needs the Dreamcast program, see below), else the
#                  converted data as fpdc-dc-data.zip
#   * "android" -> fpdc-data.zip, the package the launcher imports (IMPORT GAME DATA)
#   * "data"    -> the converted data folder on its own (for debugging the converter)
#
# Two ways to start it:
#   1. Actions tab -> "Convert game data" -> Run workflow, paste a *direct* download link.
#   2. Edit .convert/request.txt in the GitHub web or app, save -- the push starts the conversion.
#      (The file has to change, so on a second run either edit it again or use Run workflow.)
# The download may be a zip or a 7z with Assets.dat inside, or Assets.dat itself. Google Drive share
# links are turned into direct ones automatically; for other hosts use the link the browser downloads from.
# The result appears in the run's Artifacts section when it finishes.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Direct download link to the archive (zip/7z with Assets.dat inside, or Assets.dat itself)'
        required: true
        type: string
      target:
        description: 'What to build'
        required: true
        default: dc
        type: choice
        options:
          - dc
          - android
          - data
      name:
        description: 'Optional label for the artifact file names'
        required: false
        default: ''
        type: string
      elf_url:
        description: 'Optional: a direct link to fpdc.elf to build a disc image with (else the data only)'
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.convert/request.txt'

concurrency:
  group: convert-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  convert:
    name: Convert
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Read the request
        env:
          IN_URL: ${{ inputs.url }}
          IN_TARGET: ${{ inputs.target }}
          IN_LABEL: ${{ inputs.name }}
          IN_ELF: ${{ inputs.elf_url }}
        run: |
          set -o pipefail
          # a dispatch carries the inputs; a push carries them in .convert/request.txt
          cfg=.convert/request.txt
          get() { [ -f "$cfg" ] && sed -n "s/^[[:space:]]*$1[[:space:]]*:[[:space:]]*//p" "$cfg" | head -1; }
          url="$IN_URL"; target="$IN_TARGET"; label="$IN_LABEL"; elf="$IN_ELF"
          [ -n "$url" ] || url="$(get url)"
          [ -n "$target" ] || target="$(get target)"
          [ -n "$label" ] || label="$(get name)"
          [ -n "$elf" ] || elf="$(get elf)"
          target="${target:-dc}"
          case "$target" in dc|android|data) ;; *) echo "::error::target must be dc, android or data (got '$target')"; exit 1 ;; esac
          if [ -z "$url" ]; then
            # the template: saving it without a link is not a failure, there is simply nothing to do
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "::notice::no url in .convert/request.txt yet -- nothing to convert"
            exit 0
          fi
          echo "url: $url"
          echo "target: $target"
          echo "label: ${label:-<run number>}"
          echo "fpdc.elf: ${elf:-<none: the data only>}"
          {
            echo "URL=$url"
            echo "TARGET=$target"
            echo "LABEL=$label"
            echo "ELF=$elf"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the archive
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          mkdir -p in
          url="$URL"
          # a Google Drive "share" link is not a download link; the direct form needs the id
          case "$url" in
            *drive.google.com*)
              id=$(printf '%s' "$url" | sed -n 's#.*/d/\([^/]*\)/.*#\1#p; s#.*[?&]id=\([^&]*\).*#\1#p' | head -1)
              if [ -n "$id" ]; then
                echo "google drive id: $id"
                url="https://drive.google.com/uc?export=download&id=$id&confirm=t"
              fi
              ;;
          esac
          echo "downloading $url"
          curl -L --retry 3 --retry-delay 5 --fail --max-time 3600 -o "in/payload" "$url" \
            || { echo "::error::the download failed (is the link a direct file link?)"; exit 1; }
          ls -la in
          file in/payload || true
          echo "size: $(du -h in/payload | cut -f1)"

      - name: Unpack and find Assets.dat
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          mkdir -p src
          magic=$(head -c 4 in/payload | od -An -tx1 | tr -d ' \n')
          if [ "$magic" = "504b0304" ]; then
            echo "a zip archive"
            unzip -q -o in/payload -d src || { echo "::error::unzip failed"; exit 1; }
          elif [ "$magic" = "377abcaf" ]; then
            echo "a 7z archive"
            sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
            7z x -y -osrc in/payload > /dev/null || { echo "::error::7z failed"; exit 1; }
          else
            echo "not an archive: taking it as Assets.dat"
            cp in/payload src/Assets.dat
          fi
          ls -la src | head -20
          found=$(find src -iname 'Assets.dat' -type f | head -1)
          if [ -z "$found" ]; then
            echo "::error::no Assets.dat in the archive (it holds: $(find src -maxdepth 2 | head -10 | tr '\n' ' '))"
            exit 1
          fi
          echo "Assets.dat: $found ($(du -h "$found" | cut -f1))"
          echo "ASSETS=$found" >> "$GITHUB_ENV"

      - name: Tools the converter needs
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          # The builder's own pinned downloads are not published any more, so give it what it can use
          # locally: ffmpeg and cc from the runner, the Python packages from PyPI.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip build-essential
          python3 -m pip install --quiet --disable-pip-version-check pillow lz4
          python3 -c "import PIL, lz4; print('pillow', PIL.__version__, 'lz4', lz4.__version__)"
          ffmpeg -hide_banner -version | head -1
          cc --version | head -1
          mkdir -p out work
          if [ -n "$ELF" ]; then
            echo "downloading the Dreamcast program"
            if curl -L --retry 3 --fail --max-time 1800 -o work/fpdc.elf "$ELF"; then
              ls -la work/fpdc.elf
            else
              echo "::warning::could not download $ELF -- the disc image is skipped, the data is converted"
              rm -f work/fpdc.elf
            fi
            # the CDI writer is not in this checkout: build it (libisofs + meson). Not fatal: without it
            # the disc image is skipped and the converted data is uploaded instead.
            if sudo apt-get install -y -qq meson ninja-build libisofs-dev g++ 2>/dev/null &&
               git clone --depth 1 -q https://github.com/Mark65537/mkdcdisc /tmp/mkdcdisc &&
               meson setup /tmp/mkdcdisc/build /tmp/mkdcdisc > /dev/null 2>&1 &&
               ninja -C /tmp/mkdcdisc/build > /dev/null 2>&1; then
              mk=$(find /tmp/mkdcdisc/build -name 'mkdcdisc' -type f -perm -u+x | head -1)
              echo "MKDCDISC=$mk" >> "$GITHUB_ENV"
              echo "mkdcdisc: $mk"
            else
              echo "::warning::mkdcdisc could not be built -- no disc image this run"
            fi
          fi

      - name: Convert
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          args="--out out/data --work work --local-tools"
          case "$TARGET" in
            dc)
              if [ -s work/fpdc.elf ] && [ -n "${MKDCDISC:-}" ]; then
                run_target=dc; args="$args --cdi out/fpdc.cdi --elf work/fpdc.elf"
              else
                echo "::warning::no Dreamcast program or no CDI writer this run: converting the data only"
                run_target=data
              fi
              ;;
            android) run_target=android; args="$args --zip out/fpdc-data.zip" ;;
            data)    run_target=data ;;
          esac
          echo "python3 tools/builder/fpbuild.py $args $run_target $ASSETS"
          python3 tools/builder/fpbuild.py $args "$run_target" "$ASSETS" 2>&1 | tee /tmp/convert.log
          echo "----- what came out -----"
          ls -la out 2>/dev/null || true
          du -sh out/* 2>/dev/null || true

      - name: Pack the converted data when there is no disc image
        if: env.SKIP != '1' && always()
        run: |
          set -o pipefail
          if [ ! -f out/fpdc.cdi ] && [ ! -f out/fpdc-data.zip ] && [ -d out/data ] && [ -n "$(ls -A out/data 2>/dev/null)" ]; then
            echo "no disc image or package: zipping the data folder"
            ( cd out/data && zip -q -r -0 ../fpdc-dc-data.zip . )
            ls -la out/fpdc-dc-data.zip
          fi

      - name: Report
        if: failure()
        run: |
          [ -f /tmp/convert.log ] || exit 0
          grep -E "FAIL|Error|error|Traceback|missing|not found|cannot|ERROR" /tmp/convert.log \
            | head -20 | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
          echo "----- the last lines -----"
          tail -15 /tmp/convert.log | cut -c1-300 | while IFS= read -r l; do echo "::error::tail: $l"; done

      - name: Name the result
        if: env.SKIP != '1' && always()
        run: |
          set -o pipefail
          tag=$(printf '%s' "${LABEL:-run-${GITHUB_RUN_NUMBER}}" | tr -c 'A-Za-z0-9._-' '_')
          for pair in "out/fpdc.cdi:out/fpdc-$tag.cdi" \
                      "out/fpdc-data.zip:out/fpdc-data-$tag.zip" \
                      "out/fpdc-dc-data.zip:out/fpdc-dc-data-$tag.zip"; do
            src=${pair%%:*}; dst=${pair#*:}
            [ -f "$src" ] && mv "$src" "$dst" && echo "$dst"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1' && always()
        with:
          name: fpdc-${{ env.TARGET }}
          path: |
            out/fpdc-*.cdi
            out/fpdc-data-*.zip
            out/fpdc-dc-data-*.zip
            out/data
          if-no-files-found: warn
          retention-days: 30
