name: Convert game data

# Turns a game data archive into something the ports can use, without a PC setup:
#   * "dc"      -> fpdc.cdi, a Dreamcast disc image (burn it, or open it in Flycast/Redream)
#   * "android" -> fpdc-data.zip, the package the launcher imports (IMPORT GAME DATA)
#   * "data"    -> the converted data folder on its own (for debugging the converter)
#
# Two ways to start it:
#   1. Actions tab -> "Convert game data" -> Run workflow, paste a *direct* download link.
#   2. Edit .convert/request.txt in the GitHub web or app, save -- the push starts the conversion.
#      (The file has to change, so on a second run either edit it again or use Run workflow.)
# The download may be a zip or a 7z with Assets.dat inside, or Assets.dat itself. Google Drive share
# links are turned into direct ones automatically; for other hosts use the link the browser downloads from.
# The result appears in the run's Artifacts section when it finishes.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Direct download link to the archive (zip/7z with Assets.dat inside, or Assets.dat itself)'
        required: true
        type: string
      target:
        description: 'What to build'
        required: true
        default: dc
        type: choice
        options:
          - dc
          - android
          - data
      name:
        description: 'Optional label for the artifact file names'
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.convert/request.txt'

concurrency:
  group: convert-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  convert:
    name: Convert
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Read the request
        env:
          IN_URL: ${{ inputs.url }}
          IN_TARGET: ${{ inputs.target }}
          IN_LABEL: ${{ inputs.name }}
        run: |
          set -o pipefail
          # a dispatch carries the inputs; a push carries them in .convert/request.txt
          cfg=.convert/request.txt
          get() { [ -f "$cfg" ] && sed -n "s/^[[:space:]]*$1[[:space:]]*:[[:space:]]*//p" "$cfg" | head -1; }
          url="$IN_URL"; target="$IN_TARGET"; label="$IN_LABEL"
          [ -n "$url" ] || url="$(get url)"
          [ -n "$target" ] || target="$(get target)"
          [ -n "$label" ] || label="$(get name)"
          target="${target:-dc}"
          case "$target" in dc|android|data) ;; *) echo "::error::target must be dc, android or data (got '$target')"; exit 1 ;; esac
          if [ -z "$url" ]; then
            # the template: saving it without a link is not a failure, there is simply nothing to do
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "::notice::no url in .convert/request.txt yet -- nothing to convert"
            exit 0
          fi
          echo "url: $url"
          echo "target: $target"
          echo "label: ${label:-<run number>}"
          {
            echo "URL=$url"
            echo "TARGET=$target"
            echo "LABEL=$label"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download the archive
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          mkdir -p in
          url="$URL"
          # a Google Drive "share" link is not a download link; the direct form needs the id
          case "$url" in
            *drive.google.com*)
              id=$(printf '%s' "$url" | sed -n 's#.*/d/\([^/]*\)/.*#\1#p; s#.*[?&]id=\([^&]*\).*#\1#p' | head -1)
              if [ -n "$id" ]; then
                echo "google drive id: $id"
                url="https://drive.google.com/uc?export=download&id=$id&confirm=t"
              fi
              ;;
          esac
          echo "downloading $url"
          curl -L --retry 3 --retry-delay 5 --fail --max-time 3600 -o "in/payload" "$url" \
            || { echo "::error::the download failed (is the link a direct file link?)"; exit 1; }
          ls -la in
          file in/payload || true
          echo "size: $(du -h in/payload | cut -f1)"

      - name: Unpack and find Assets.dat
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          mkdir -p src
          magic=$(head -c 4 in/payload | od -An -tx1 | tr -d ' \n')
          if [ "$magic" = "504b0304" ]; then
            echo "a zip archive"
            unzip -q -o in/payload -d src || { echo "::error::unzip failed"; exit 1; }
          elif [ "$magic" = "377abcaf" ]; then
            echo "a 7z archive"
            sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
            7z x -y -osrc in/payload > /dev/null || { echo "::error::7z failed"; exit 1; }
          else
            echo "not an archive: taking it as Assets.dat"
            cp in/payload src/Assets.dat
          fi
          ls -la src | head -20
          found=$(find src -iname 'Assets.dat' -type f | head -1)
          if [ -z "$found" ]; then
            echo "::error::no Assets.dat in the archive (it holds: $(find src -maxdepth 2 | head -10 | tr '\n' ' '))"
            exit 1
          fi
          echo "Assets.dat: $found ($(du -h "$found" | cut -f1))"
          echo "ASSETS=$found" >> $GITHUB_ENV

      - name: Convert
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          mkdir -p out work
          args="--out out/data --work work"
          case "$TARGET" in
            dc)      args="$args --cdi out/fpdc.cdi" ;;
            android) args="$args --zip out/fpdc-data.zip" ;;
            data)    ;;
          esac
          echo "python3 tools/builder/fpbuild.py $args $TARGET $ASSETS"
          python3 tools/builder/fpbuild.py $args "$TARGET" "$ASSETS" 2>&1 | tee /tmp/convert.log
          echo "----- what came out -----"
          ls -la out
          find out -maxdepth 1 -type f -size +1M -printf '%f %s bytes\n' || true

      - name: Report
        if: failure()
        run: |
          if [ -f /tmp/convert.log ]; then
            grep -E "FAIL|Error|error|Traceback|missing|not found|cannot" /tmp/convert.log \
              | head -20 | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
            echo "----- the last lines -----"
            tail -15 /tmp/convert.log | cut -c1-300 | while IFS= read -r l; do echo "::error::tail: $l"; done
          fi

      - name: Name the result
        if: env.SKIP != '1' && success()
        run: |
          set -e
          tag=$(printf '%s' "${LABEL:-run-${GITHUB_RUN_NUMBER}}" | tr -c 'A-Za-z0-9._-' '_')
          case "$TARGET" in
            dc)      src=out/fpdc.cdi;          dst="out/fpdc-$tag.cdi";        [ -f "$src" ] || dst="" ;;
            android) src=out/fpdc-data.zip;     dst="out/fpdc-data-$tag.zip";   [ -f "$src" ] || dst="" ;;
            data)    src=out/data;              dst="" ;;
          esac
          if [ -n "${dst:-}" ]; then mv "$src" "$dst"; fi
          ls -la out
          du -sh out/* 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1' && success()
        with:
          name: fpdc-${{ env.TARGET }}
          path: |
            out/fpdc-*.cdi
            out/fpdc-data-*.zip
            out/data
          if-no-files-found: error
          retention-days: 30
