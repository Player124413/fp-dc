name: Android

# Everything that can be checked without a phone: the host-side checks of the port, the APK build with
# the real NDK, and a smoke test that boots an emulator, installs the APK and launches the launcher.
# Any failure is echoed as a check-run annotation, so the reason is visible without downloading logs.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------------------- host checks
  checks:
    name: Host checks (no NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Android sources, twiddle, font, shell
        run: |
          set -o pipefail
          make -C tools/android check 2>&1 | tee /tmp/check.log

      - name: Render every shell screen
        run: |
          set -o pipefail
          make -C tools/android preview 2>&1 | tee /tmp/preview.log
          ls -la tools/preview/out/*.png | head -5

      - name: Report
        if: failure()
        run: |
          for f in /tmp/check.log /tmp/preview.log; do
            [ -f "$f" ] || continue
            grep -E "error|Error|FAILED|No such|cannot|undefined reference" "$f" | head -20 |
              while IFS= read -r l; do echo "::error::$l"; done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-screens
          path: tools/preview/out/*.png
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------------------------------- the APK
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only first-party actions plus plain shell: the runner image already ships the Android SDK, so
      # nothing here depends on a third-party action being downloadable.
      - name: Android SDK, NDK, CMake
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager: $SM"
          "$SM" --version
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
                 "cmake;3.22.1" "ndk;26.1.10909125" 2>&1 | tail -20
          echo "--- installed ndk:"; ls "$SDK/ndk" || true
          echo "--- installed cmake:"; ls "$SDK/cmake" || true
          NDK="$(ls "$SDK/ndk" 2>/dev/null | head -1)"
          echo "FP_NDK=$NDK" >> $GITHUB_ENV

      - name: Gradle 8.7
        run: |
          set -o pipefail
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
          "$HOME/gradle-8.7/bin/gradle" --version | head -6

      - name: Build the APKs (debug and release)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          set -o pipefail
          gradle --no-daemon --warning-mode all -p android \
                 ${FP_NDK:+-PfpNdk=$FP_NDK} assembleDebug assembleRelease 2>&1 | tee /tmp/build.log

      - name: Check what went into the APK
        run: |
          set -e
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            unzip -l "$apk" | grep -E 'lib/.*/libfpdc\.so' || { echo "::error::the native library is missing from $apk"; exit 1; }
            unzip -l "$apk" | grep -q 'classes.dex' || { echo "::error::no classes.dex in $apk"; exit 1; }
          done
          ls -la android/app/build/outputs/apk/*/*.apk

      - name: Report
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            grep -E "error:|FAILURE|What went wrong|Caused by|Could not|Execution failed|CMake Error|fatal error|ndk" /tmp/build.log |
              head -40 | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fpdc-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------------------- emulator run
  smoke:
    name: Smoke test on an emulator
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fpdc-apk
          path: apk

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install and run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          script: |
            mkdir -p out
            adb install -r apk/app-release.apk || adb install -r apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.fpdc.port/.FpActivity
            sleep 25
            adb exec-out screencap -p > out/launcher.png
            adb shell wm size
            adb logcat -d -v brief > out/logcat.txt
            echo "----- fpdc -----"
            grep -E "fpdc|AndroidRuntime" out/logcat.txt | head -60 || true
            echo "---------------"
            fail=0
            for pat in "FATAL EXCEPTION" "ANR in com.fpdc.port" "Unable to find native component" \
                       "UnsatisfiedLinkError" "E AndroidRuntime"; do
              if grep -q "$pat" out/logcat.txt; then echo "::error::found: $pat"; fail=1; fi
            done
            grep -q "gles: renderer up" out/logcat.txt || { echo "::error::the GLES renderer never came up"; fail=1; }
            grep -q "shell: data" out/logcat.txt || { echo "::error::the shell never initialised"; fail=1; }
            exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-run
          path: out/
          if-no-files-found: warn
          retention-days: 14
