name: Android

# Everything that can be checked without a phone: the host-side checks of the port, the APK build with
# the real NDK, and a smoke test that boots an emulator, installs the APK, launches the launcher and
# fails on a crash (the logcat and a screenshot are kept as artifacts).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------------------- host checks
  checks:
    name: Host checks (no NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Android sources, twiddle, font, shell
        run: make -C tools/android check
      - name: Render every shell screen
        run: make -C tools/android preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-screens
          path: tools/preview/out/*.png
          retention-days: 14

  # ------------------------------------------------------------------------------------------- the APK
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: NDK, CMake, platform, build tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null
          echo "ndk: $(ls "$ANDROID_HOME/ndk")"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APKs (debug and release)
        run: gradle -p android --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Check what went into the APK
        run: |
          set -e
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            unzip -l "$apk" | grep -E 'lib/.*/(libfpdc\.so|libandroid\.so)' || { echo "the native library is missing"; exit 1; }
            unzip -l "$apk" | grep -q 'classes.dex' || { echo "no dex (the Java part is missing)"; exit 1; }
            unzip -p "$apk" AndroidManifest.xml | head -c 8 | od -c | head -1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: fpdc-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-build-logs
          path: |
            android/app/build/**/*.log
            android/.gradle/**/*.log
          retention-days: 7

  # ------------------------------------------------------------------------------------- emulator run
  smoke:
    name: Smoke test on an emulator
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fpdc-apk
          path: apk

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          script: |
            adb install -r apk/app-release.apk || adb install -r apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.fpdc.port/.FpActivity
            sleep 25
            mkdir -p out
            adb exec-out screencap -p > out/launcher.png
            # the launcher's buttons: CONTROLS, then BACK
            adb shell wm size
            adb logcat -d -v brief > out/logcat.txt
            echo "----- fpdc -----"
            grep -E "fpdc|AndroidRuntime|libc " out/logcat.txt | head -80 || true
            echo "---------------"
            fail=0
            for pat in "FATAL EXCEPTION" "ANR in com.fpdc.port" "Unable to find native component" \
                       "UnsatisfiedLinkError" "E AndroidRuntime"; do
              if grep -q "$pat" out/logcat.txt; then echo "FOUND PROBLEM: $pat"; fail=1; fi
            done
            if ! grep -q "gles: renderer up" out/logcat.txt; then echo "the GLES renderer never came up"; fail=1; fi
            if ! grep -q "shell: data" out/logcat.txt; then echo "the shell never initialised"; fail=1; fi
            exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-run
          path: out/
          retention-days: 14
