name: Android

# Everything that can be checked without a phone: the host-side checks of the port, the APK build with
# the real NDK, and a smoke test that boots an emulator, installs the APK and launches the launcher.
# Failures are echoed as check-run annotations (the log downloads are not always reachable), and every
# successful build publishes the APKs to a release so they can be downloaded from a stable URL.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK: '26.1.10909125'
  API: '34'

jobs:
  # ------------------------------------------------------------------------------------- host checks
  checks:
    name: Host checks (no NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Android sources, twiddle, font, shell
        run: |
          set -o pipefail
          make -C tools/android check 2>&1 | tee /tmp/check.log

      - name: Render every shell screen
        run: |
          set -o pipefail
          make -C tools/android preview 2>&1 | tee /tmp/preview.log
          ls tools/preview/out/*.png | wc -l

      - name: Report
        if: failure()
        run: |
          for f in /tmp/check.log /tmp/preview.log; do
            [ -f "$f" ] || continue
            grep -E "error|Error|FAILED|No such|cannot|undefined reference" "$f" | head -20 |
              while IFS= read -r l; do echo "::error::$l"; done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-screens
          path: tools/preview/out/*.png
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------------------------------- the APK
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only first-party actions plus plain shell: the runner image already ships the Android SDK.
      - name: Android SDK, NDK, CMake
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-$API" "build-tools;$API.0.0" \
                 "cmake;3.22.1" "ndk;$NDK" 2>&1 | tail -20
          echo "--- ndk:"; ls "$SDK/ndk" || true
          echo "--- cmake:"; ls "$SDK/cmake" || true
          echo "FP_NDK=$(ls "$SDK/ndk" | head -1)" >> $GITHUB_ENV

      - name: Gradle 8.7
        run: |
          set -o pipefail
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
          "$HOME/gradle-8.7/bin/gradle" --version | head -6

      - name: Build the APKs (debug and release)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          set -o pipefail
          gradle --no-daemon --warning-mode all -p android \
                 ${FP_NDK:+-PfpNdk=$FP_NDK} assembleDebug assembleRelease 2>&1 | tee /tmp/build.log

      - name: Check what went into the APK
        run: |
          set -e
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            unzip -l "$apk" | grep -E 'lib/.*/libfpdc\.so' || { echo "::error::the native library is missing from $apk"; exit 1; }
            unzip -l "$apk" | grep -q 'classes.dex' || { echo "::error::no classes.dex in $apk"; exit 1; }
          done
          ls -la android/app/build/outputs/apk/*/*.apk

      - name: Report
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            grep -E "error:|FAILURE|What went wrong|Caused by|Could not|Execution failed|CMake Error|fatal error|undefined reference|multiple definition|duplicate symbol" /tmp/build.log |
              head -40 | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fpdc-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------------------- emulator run
  smoke:
    name: Smoke test on an emulator
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fpdc-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Emulator and system image
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          echo "$SDK/emulator" >> $GITHUB_PATH
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "java: $(command -v java || echo MISSING)"
          ls "$SDK" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || { echo "::error::no sdkmanager at $SM"; exit 1; }
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          if ! "$SM" --install "platform-tools" "emulator" "system-images;android-33;default;x86_64" > /tmp/sdk.log 2>&1; then
            echo "::error::sdkmanager install failed: $(tail -3 /tmp/sdk.log | tr '\n' ' ')"
            exit 1
          fi
          echo "installed: $(grep -c . /tmp/sdk.log) lines of output"
          AVDM="$SDK/cmdline-tools/latest/bin/avdmanager"
          [ -x "$AVDM" ] || { echo "::error::no avdmanager at $AVDM"; exit 1; }
          if ! echo no | "$AVDM" create avd -n fp -k "system-images;android-33;default;x86_64" --force > /tmp/avd.log 2>&1; then
            echo "::error::avdmanager failed: $(tail -3 /tmp/avd.log | tr '\n' ' ')"
            exit 1
          fi
          "$AVDM" list avd | head -10

      - name: Boot
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          command -v adb || { echo "::error::adb not found"; exit 1; }
          nohup "$SDK/emulator/emulator" -avd fp -no-window -no-audio -no-boot-anim -no-snapshot \
                -gpu swiftshader_indirect -camera-back none -camera-front none -accel auto \
                > /tmp/emulator.log 2>&1 &
          EMU=$!
          dump() {
            echo "::error::$1"
            tail -8 /tmp/emulator.log | cut -c1-250 | while IFS= read -r l; do echo "::error::emu: $l"; done
            exit 1
          }
          sleep 10
          kill -0 $EMU 2>/dev/null || dump "the emulator process died right away"
          timeout 120 adb wait-for-device || dump "no device appeared (adb wait-for-device timed out)"
          ok=0
          for i in $(seq 1 60); do
            b=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$b" = "1" ]; then echo "booted after ~$((i*4))s"; ok=1; break; fi
            kill -0 $EMU 2>/dev/null || dump "the emulator died while booting"
            sleep 4
          done
          [ "$ok" = "1" ] || dump "sys.boot_completed never became 1"
          timeout 20 adb shell wm size || true
          timeout 20 adb shell wm density || true

      - name: Install and run
        run: |
          mkdir -p out
          adb install -r apk/app-release.apk 2>&1 | tail -3 || adb install -r apk/app-debug.apk
          adb logcat -c
          adb shell am start -W -n com.fpdc.port/.FpActivity
          sleep 25
          adb shell pidof com.fpdc.port || echo "::error::the process is not running any more"
          adb exec-out screencap -p > out/launcher.png
          # a real screen is not a black rectangle: a blank 1080p PNG compresses to a few KB
          sz=$(stat -c %s out/launcher.png); echo "screenshot: $sz bytes"
          [ "$sz" -gt 20000 ] || echo "::error::the screen looks blank ($sz bytes)"
          # BACK goes from HOME to the same screen; the app must survive it
          adb shell input keyevent KEYCODE_BACK
          sleep 3
          adb exec-out screencap -p > out/after-back.png
          adb logcat -d -v brief > out/logcat.txt
          echo "----- fpdc -----"
          grep -E "fpdc|AndroidRuntime" out/logcat.txt | head -60 || true
          echo "---------------"
          fail=0
          for pat in "FATAL EXCEPTION" "ANR in com.fpdc.port" "Unable to find native component" \
                     "UnsatisfiedLinkError" "E AndroidRuntime" "has died"; do
            if grep -q "$pat" out/logcat.txt; then echo "::error::found: $pat"; fail=1; fi
          done
          grep -q "gles: renderer up" out/logcat.txt || { echo "::error::the GLES renderer never came up"; fail=1; }
          grep -q "shell: data" out/logcat.txt || { echo "::error::the shell never initialised"; fail=1; }
          grep -q "AAudio\|snd: " out/logcat.txt || echo "warning: no audio line (expected with -no-audio)"
          adb shell pidof com.fpdc.port > /dev/null || { echo "::error::the app crashed"; fail=1; }
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-run
          path: out/
          if-no-files-found: warn
          retention-days: 14

  # ----------------------------------------------------------------------------------- stable download
  publish:
    name: Publish the APK
    needs: apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fpdc-apk
          path: apk

      - name: Attach to the 'android-build' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          ls -la apk
          TAG=android-build
          if ! out=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" 2>&1); then
            echo "(no release yet: $out)"
            if ! out=$(gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease \
                 --title "Android build" --notes "Newest APK of the Android port." 2>&1); then
              echo "::error::gh release create: $(echo "$out" | head -3 | tr '\n' ' ')"
              exit 1
            fi
          fi
          mapfile -t files < <(find apk -name '*.apk')
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no .apk in the artifact: $(find apk -type f | head -5 | tr '\n' ' ')"; exit 1; }
          echo "uploading: ${files[*]}"
          if ! out=$(gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "${files[@]}" --clobber 2>&1); then
            echo "::error::gh release upload: $(echo "$out" | head -3 | tr '\n' ' ')"
            exit 1
          fi
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease \
            --notes "Newest APK of the Android port. Built from $SHA (branch $BRANCH).

          Install app-release.apk (sideload). The APK ships no game data: convert your own Assets.dat
          (python3 tools/builder/fpbuild.py android Assets.dat) and use IMPORT DATA in the launcher."
          echo "release: ${{ github.server_url }}/$GITHUB_REPOSITORY/releases/tag/$TAG"
