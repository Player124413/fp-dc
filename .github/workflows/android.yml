name: Android

# Everything that can be checked without a phone: the host-side checks of the port, the APK build with
# the real NDK, and a smoke test that boots an emulator, installs the APK and launches the launcher.
# Failures are echoed as check-run annotations (the log downloads are not always reachable); the APKs
# of a successful build are the 'fpdc-apk' artifact of the run.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK: '26.1.10909125'
  API: '34'

jobs:
  # ------------------------------------------------------------------------------------- host checks
  checks:
    name: Host checks (no NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Android sources, twiddle, font, shell
        run: |
          set -o pipefail
          make -C tools/android check 2>&1 | tee /tmp/check.log

      - name: Render every shell screen
        run: |
          set -o pipefail
          make -C tools/android preview 2>&1 | tee /tmp/preview.log
          ls tools/preview/out/*.png | wc -l

      - name: Report
        if: failure()
        run: |
          for f in /tmp/check.log /tmp/preview.log; do
            [ -f "$f" ] || continue
            grep -E "error|Error|FAILED|No such|cannot|undefined reference" "$f" | head -20 |
              while IFS= read -r l; do echo "::error::$l"; done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-screens
          path: tools/preview/out/*.png
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------------------------------- the APK
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only first-party actions plus plain shell: the runner image already ships the Android SDK.
      - name: Android SDK, NDK, CMake
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-$API" "build-tools;$API.0.0" \
                 "cmake;3.22.1" "ndk;$NDK" 2>&1 | tail -20
          echo "--- ndk:"; ls "$SDK/ndk" || true
          echo "--- cmake:"; ls "$SDK/cmake" || true
          echo "FP_NDK=$(ls "$SDK/ndk" | head -1)" >> $GITHUB_ENV

      - name: Gradle 8.7
        run: |
          set -o pipefail
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
          "$HOME/gradle-8.7/bin/gradle" --version | head -6

      - name: Build the APKs (debug and release)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          set -o pipefail
          gradle --no-daemon --warning-mode all -p android \
                 ${FP_NDK:+-PfpNdk=$FP_NDK} assembleDebug assembleRelease 2>&1 | tee /tmp/build.log

      - name: Check what went into the APK
        run: |
          set -e
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            unzip -l "$apk" | grep -E 'lib/.*/libfpdc\.so' || { echo "::error::the native library is missing from $apk"; exit 1; }
            unzip -l "$apk" | grep -q 'classes.dex' || { echo "::error::no classes.dex in $apk"; exit 1; }
          done
          ls -la android/app/build/outputs/apk/*/*.apk

      - name: Report
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            grep -E "error:|FAILURE|What went wrong|Caused by|Could not|Execution failed|CMake Error|fatal error|undefined reference|multiple definition|duplicate symbol" /tmp/build.log |
              head -40 | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fpdc-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------------------- emulator run
  smoke:
    name: Smoke test on an emulator
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fpdc-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Emulator and system image
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          echo "$SDK/emulator" >> $GITHUB_PATH
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # pin where the AVD lives, or avdmanager and the emulator disagree (they then look in
          # $ANDROID_AVD_HOME, $ANDROID_SDK_HOME/avd and $HOME/.android/avd)
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> $GITHUB_ENV
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> $GITHUB_ENV
          echo "java: $(command -v java || echo MISSING)"
          ls "$SDK" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || { echo "::error::no sdkmanager at $SM"; exit 1; }
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          if ! "$SM" --install "platform-tools" "emulator" "system-images;android-33;default;x86_64" > /tmp/sdk.log 2>&1; then
            echo "::error::sdkmanager install failed: $(tail -3 /tmp/sdk.log | tr '\n' ' ')"
            exit 1
          fi
          echo "installed: $(grep -c . /tmp/sdk.log) lines of output"
          AVDM="$SDK/cmdline-tools/latest/bin/avdmanager"
          [ -x "$AVDM" ] || { echo "::error::no avdmanager at $AVDM"; exit 1; }
          if ! echo no | "$AVDM" create avd -n fp -k "system-images;android-33;default;x86_64" --force > /tmp/avd.log 2>&1; then
            echo "::error::avdmanager failed: $(tail -3 /tmp/avd.log | tr '\n' ' ')"
            exit 1
          fi
          "$AVDM" list avd | head -10
          ls -la "$ANDROID_AVD_HOME" || true
          [ -f "$ANDROID_AVD_HOME/fp.ini" ] || { echo "::error::avdmanager did not write $ANDROID_AVD_HOME/fp.ini"; exit 1; }

      - name: Boot
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          command -v adb || { echo "::error::adb not found"; exit 1; }
          "$SDK/emulator/emulator" -list-avds 2>&1 | head -5
          nohup "$SDK/emulator/emulator" -avd fp -no-window -no-audio -no-boot-anim -no-snapshot \
                -gpu swiftshader_indirect -camera-back none -camera-front none -accel auto \
                > /tmp/emulator.log 2>&1 &
          EMU=$!
          dump() {
            echo "::error::$1"
            tail -8 /tmp/emulator.log | cut -c1-250 | while IFS= read -r l; do echo "::error::emu: $l"; done
            exit 1
          }
          sleep 10
          kill -0 $EMU 2>/dev/null || dump "the emulator process died right away"
          timeout 120 adb wait-for-device || dump "no device appeared (adb wait-for-device timed out)"
          ok=0
          for i in $(seq 1 60); do
            b=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$b" = "1" ]; then echo "booted after ~$((i*4))s"; ok=1; break; fi
            kill -0 $EMU 2>/dev/null || dump "the emulator died while booting"
            sleep 4
          done
          [ "$ok" = "1" ] || dump "sys.boot_completed never became 1"
          timeout 20 adb shell wm size || true
          timeout 20 adb shell wm density || true

      - name: Install and run
        run: |
          mkdir -p out
          apk=$(find apk -name 'app-release.apk' | head -1)
          [ -n "$apk" ] || apk=$(find apk -name '*.apk' | head -1)
          echo "installing $apk"
          adb install -r "$apk" > /tmp/install.log 2>&1 || {
            echo "::error::install failed: $(tail -2 /tmp/install.log | tr '\n' ' ')"; exit 1; }
          adb logcat -c || true
          adb logcat -b crash -c || true
          adb shell am start -W -n com.fpdc.port/.FpActivity > /tmp/start.log 2>&1 || \
            echo "::error::am start: $(tail -2 /tmp/start.log | tr '\n' ' ')"

          gone() { [ -z "$(timeout 15 adb shell pidof com.fpdc.port 2>/dev/null | tr -d '\r')" ]; }
          # wait for the renderer and the window, stopping as soon as the process disappears
          died=""
          for i in $(seq 1 30); do
            adb logcat -d 2>/dev/null | grep -q "window up" && break
            gone && { died="after ~$((i*3))s"; break; }
            sleep 3
          done
          echo "died: ${died:-no}"
          sleep 3
          adb exec-out screencap -p > out/launcher.png || true
          for i in 1 2 3; do
            adb exec-out screencap > /tmp/screen.raw 2>/dev/null || true
            [ "$(stat -c %s /tmp/screen.raw 2>/dev/null || echo 0)" -gt 1000 ] && break
            sleep 1
          done
          timeout 40 adb logcat -d -v brief > out/logcat.txt || true
          timeout 40 adb logcat -d -b crash -v brief > out/crash.txt || true

          echo "----- the port's log -----"
          grep -E "I/fpdc" out/logcat.txt | tail -8 | cut -c1-220 > /tmp/lines.txt || true
          while IFS= read -r l; do echo "  $l"; echo "::warning::$l"; done < /tmp/lines.txt

          fail=0
          [ -n "$died" ] && { echo "::error::the process died $died"; fail=1; }
          for pat in "FATAL EXCEPTION" "ANR in com.fpdc.port" "Unable to find native component" \
                     "UnsatisfiedLinkError"; do
            grep -qE "$pat" out/logcat.txt && { echo "::error::found: $pat"; fail=1; }
          done
          [ -s out/crash.txt ] && { echo "::error::the crash buffer is not empty"; fail=1; }
          grep -q "gles: renderer up" out/logcat.txt || { echo "::error::the GLES renderer never came up"; fail=1; }
          grep -q "window up"          out/logcat.txt || { echo "::error::no window was ever created"; fail=1; }
          sz=$(stat -c %s out/launcher.png); echo "screenshot: $sz bytes"
          [ "$sz" -gt 20000 ] || { echo "::error::the screen looks blank ($sz bytes)"; fail=1; }

          # BACK on the home screen quits the port; anything else must not take the app down
          alive_before=$(timeout 15 adb shell pidof com.fpdc.port 2>/dev/null | tr -d '\r')
          adb shell input keyevent KEYCODE_BACK || true
          sleep 4
          adb exec-out screencap -p > out/after-back.png || true
          alive_after=$(timeout 15 adb shell pidof com.fpdc.port 2>/dev/null | tr -d '\r')
          if [ -n "$alive_before" ] && [ -z "$alive_after" ]; then
            # the port leaves with finishApp() and logs 'exiting' first: that is a clean quit
            grep -q "exiting" out/logcat.txt || { echo "::error::BACK killed the app without a clean quit"; fail=1; }
            adb logcat -d -b crash | grep -q "Fatal signal" && { echo "::error::BACK crashed the app"; fail=1; }
          fi
          [ -s out/crash.txt ] && { echo "::error::the app crashed"; fail=1; }
          exit $fail

      - name: Tap through the shell
        run: |
          mkdir -p out
          apk=$(find apk -name 'app-debug.apk' | head -1)
          [ -n "$apk" ] || { echo "no debug apk, skipping the tap test"; exit 0; }
          adb install -r "$apk" > /tmp/install2.log 2>&1 || {
            echo "::error::install failed: $(tail -2 /tmp/install2.log | tr '\n' ' ')"; exit 1; }
          adb logcat -c || true
          adb logcat -b crash -c || true
          adb shell am force-stop com.fpdc.port || true
          adb shell am start -W -n com.fpdc.port/.FpActivity > /dev/null 2>&1 || true
          for i in $(seq 1 30); do
            adb logcat -d 2>/dev/null | grep -q "window up" && break
            sleep 2
          done
          geo=$(adb logcat -d | grep -o "window up: [0-9]*x[0-9]* [0-9.]*x" | tail -1)
          echo "geometry: $geo"
          [ -n "$geo" ] || { echo "::error::the port never reported a window"; exit 1; }
          set -- $geo                       # window up: 640x320 1.00x
          WINW=$(echo "$3" | cut -dx -f1)
          WINH=$(echo "$3" | cut -dx -f2)
          SCALE=${4%x}
          echo "window $WINW x $WINH, density scale $SCALE"

          fail=0
          mark=0
          btn() {    # $1 = index of the home button (0 play/import, 1 controls, 2 settings, 3 about)
            python3 -c "
          w, h, s, i = float('$WINW'), float('$WINH'), float('$SCALE'), int('$1')
          dpw, dph = w / s, h / s
          bw, bh, gap, margin = 250.0, 44.0, 11.0, 26.0
          total = 4 * bh + 3 * gap
          x = dpw - margin - bw
          y = (dph - total) / 2 + i * (bh + gap)
          print(int((x + bw / 2) * s), int((y + bh / 2) * s))
          "
          }
          expect() {  # $1 = the screen that must open, $2 = what it is
            for i in $(seq 1 10); do
              adb logcat -d 2>/dev/null | tail -n +$((mark + 1)) | grep -q "screen $1" && {
                echo "  ok: $2 (screen $1)"; return 0; }
              sleep 1
            done
            echo "::error::$2 did not open (no 'screen $1' in the log)"
            adb logcat -d 2>/dev/null | tail -n +$((mark + 1)) | grep -E "I/fpdc" | tail -5 \
              | while IFS= read -r l; do echo "::error::log: $l"; done
            fail=1
            return 1
          }

          mark=$(adb logcat -d | wc -l)
          read -r X Y <<< "$(btn 1)"
          echo "tapping CONTROLS at $X,$Y"
          adb shell input tap "$X" "$Y"
          expect 2 "the controls editor"
          sleep 2
          adb exec-out screencap -p > out/controls.png || true
          for i in 1 2 3; do
            adb exec-out screencap > /tmp/controls.raw 2>/dev/null || true
            [ "$(stat -c %s /tmp/controls.raw 2>/dev/null || echo 0)" -gt 1000 ] && break
            sleep 1
          done
          if [ -s out/controls.png ] && [ -s out/launcher.png ]; then
            cmp -s out/controls.png out/launcher.png && {
              echo "::error::the controls screen looks identical to the home screen"; fail=1; }
            sz2=$(stat -c %s out/controls.png); echo "controls screenshot: $sz2 bytes"
            [ "$sz2" -gt 20000 ] || { echo "::error::the controls screen looks blank ($sz2 bytes)"; fail=1; }
          fi
          # drag on the pad: the editor must survive a gesture
          adb shell input swipe $((X - 380)) $((Y + 40)) $((X - 180)) $((Y + 100)) 300 || true
          sleep 1
          mark=$(adb logcat -d | wc -l)
          adb shell input keyevent KEYCODE_BACK; sleep 2
          expect 0 "the home screen after BACK"

          for pair in "2:1:the settings screen" "3:3:the about screen" "0:4:the data screen"; do
            idx=${pair%%:*}; rest=${pair#*:}; scr=${rest%%:*}; name=${rest#*:}
            mark=$(adb logcat -d | wc -l)
            read -r X Y <<< "$(btn "$idx")"
            echo "tapping $name at $X,$Y"
            adb shell input tap "$X" "$Y"
            expect "$scr" "$name"
            sleep 2
            adb exec-out screencap -p > "out/screen-$scr.png" || true
            mark=$(adb logcat -d | wc -l)
            adb shell input keyevent KEYCODE_BACK; sleep 2
            expect 0 "the home screen after BACK"
          done

          timeout 30 adb logcat -d -b crash > /tmp/crash2.txt || true
          [ -s /tmp/crash2.txt ] && { echo "::error::the crash buffer is not empty"; fail=1; }
          adb logcat -d | grep -E "FATAL EXCEPTION|ANR in com.fpdc.port" && { echo "::error::a Java crash"; fail=1; }
          adb logcat -d -v brief > out/logcat-taps.txt || true
          echo "----- the port's log (taps) -----"
          grep -E "I/fpdc" out/logcat-taps.txt | tail -8 | cut -c1-220 > /tmp/l2.txt || true
          while IFS= read -r l; do echo "  $l"; echo "::warning::$l"; done < /tmp/l2.txt
          exit $fail

      - name: Look at the screen
        if: always()
        run: |
          art() {   # $1 = a raw screencap, $2 = the name to print
            [ -s "$1" ] || { echo "no $2 capture"; return 0; }
            python3 - "$1" <<'EOF' > /tmp/art.txt || true
          import struct, sys
          d = open(sys.argv[1], 'rb').read()
          w = h = 0; off = 0
          for n in (4, 3):
              hdr = n * 4
              if len(d) < hdr: continue
              v = struct.unpack('<%dI' % n, d[:hdr])
              if 0 < v[0] < 5000 and 0 < v[1] < 5000 and len(d) == hdr + v[0] * v[1] * 4:
                  w, h, off = v[0], v[1], hdr
                  break
          if not w:
              print('cannot parse the screencap (%d bytes)' % len(d)); raise SystemExit
          cols, rows, lut = 78, 20, ' .:-=+*#%@'
          for r in range(rows):
              line = ''
              for c in range(cols):
                  x = int((c + 0.5) * w / cols); y = int((r + 0.5) * h / rows)
                  i = off + (y * w + x) * 4
                  b, g, rr = d[i], d[i + 1], d[i + 2]
                  lum = (rr * 30 + g * 59 + b * 11) // 100
                  line += lut[min(9, lum * 10 // 256)]
              print(line)
          EOF
            msg=$(sed -e 's/$/%0A/' /tmp/art.txt | tr -d '\n')
            echo "::warning::$2: $msg"
          }
          art /tmp/screen.raw home
          art /tmp/controls.raw controls
          ls -la /tmp/*.raw out/ 2>/dev/null | head -12 || true
      - name: Crash details
        if: always()
        run: |
          [ -s out/crash.txt ] || { echo "no crash"; exit 0; }
          echo "----- crash frames -----"
          grep -E "#[0-9]{2} pc|Fatal signal|Abort message|backtrace:" out/crash.txt | head -10 | cut -c1-200 > /tmp/f.txt || true
          while IFS= read -r l; do echo "  $l"; echo "::warning::$l"; done < /tmp/f.txt

      - name: Symbolise the crash
        if: always()
        run: |
          [ -s out/crash.txt ] || { echo "no crash"; exit 0; }
          NDKSTACK=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/*/prebuilt/linux-x86_64/bin/ndk-stack 2>/dev/null | head -1)
          echo "ndk-stack: ${NDKSTACK:-none}"
          mkdir -p sym
          (cd sym && unzip -oq ../apk/*/app-debug.apk 'lib/*' 2>/dev/null || true)
          if [ -z "$NDKSTACK" ]; then
            echo "the image has no NDK; asking the device for the tombstone"
            timeout 60 adb shell dumpsys dropbox --print SYSTEM_TOMBSTONE 2>/dev/null \
              | grep -E "#[0-9]{2} pc|signal" | head -10 | cut -c1-200 \
              | while IFS= read -r l; do echo "  $l"; echo "::warning::tomb: $l"; done
            exit 0
          fi
          "$NDKSTACK" -sym sym -dump out/crash.txt 2>&1 | grep -E "#[0-9]+|Abort|signal" | head -12 \
            | cut -c1-200 > /tmp/sym.txt || true
          echo "----- symbolised -----"
          while IFS= read -r l; do echo "  $l"; echo "::warning::sym: $l"; done < /tmp/sym.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-run
          path: out/
          if-no-files-found: warn
          retention-days: 14
