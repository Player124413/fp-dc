name: Android

# Builds the port, nothing else: the host-side checks and the APK itself. Testing happens on a real
# phone -- the app writes a log to <files>/fpdc.log that the launcher can share (ABOUT -> SHARE LOG).
# A successful run leaves app-release.apk / app-debug.apk in the 'fpdc-apk' artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK: '26.1.10909125'
  API: '34'

jobs:
  # ------------------------------------------------------------------------------------- host checks
  checks:
    name: Host checks (no NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Android sources, twiddle, font, shell
        run: |
          set -o pipefail
          make -C tools/android check 2>&1 | tee /tmp/check.log

      - name: Render every shell screen
        run: |
          set -o pipefail
          make -C tools/android preview 2>&1 | tee /tmp/preview.log
          ls tools/preview/out/*.png | wc -l

      - name: Report
        if: failure()
        run: |
          for f in /tmp/check.log /tmp/preview.log; do
            [ -f "$f" ] || continue
            grep -E "error|Error|FAILED|No such|cannot|undefined reference" "$f" | head -20 |
              while IFS= read -r l; do echo "::error::$l"; done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-screens
          path: tools/preview/out/*.png
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------------------------------- the APK
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only first-party actions plus plain shell: the runner image already ships the Android SDK.
      - name: Android SDK, NDK, CMake
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-$API" "build-tools;$API.0.0" \
                 "cmake;3.22.1" "ndk;$NDK" 2>&1 | tail -20
          echo "--- ndk:"; ls "$SDK/ndk" || true
          echo "--- cmake:"; ls "$SDK/cmake" || true
          echo "FP_NDK=$(ls "$SDK/ndk" | head -1)" >> $GITHUB_ENV

      - name: Gradle 8.7
        run: |
          set -o pipefail
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
          "$HOME/gradle-8.7/bin/gradle" --version | head -6

      - name: Build the APKs (debug and release)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          set -o pipefail
          gradle --no-daemon --warning-mode all -p android \
                 ${FP_NDK:+-PfpNdk=$FP_NDK} assembleDebug assembleRelease 2>&1 | tee /tmp/build.log

      - name: Check what went into the APK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            unzip -l "$apk" | grep -E 'lib/.*/libfpdc\.so' || { echo "::error::the native library is missing from $apk"; exit 1; }
            unzip -l "$apk" | grep -q 'classes.dex' || { echo "::error::no classes.dex in $apk"; exit 1; }
            # an update installs over the previous version only when the signature matches, so every
            # build must carry the same certificate -- the one in android/keystore
            "$BT/apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate SHA-256|Verifies"
            "$BT/aapt2" dump badging "$apk" | grep -E "^package:|native-code" || true
          done
          certs=$(for apk in android/app/build/outputs/apk/*/*.apk; do
                    "$BT/apksigner" verify --print-certs "$apk" | grep "SHA-256" | head -1; done | sort -u | wc -l)
          echo "distinct signing certificates: $certs"
          [ "$certs" = "1" ] || { echo "::error::the APKs are signed with different keys: an update would need an uninstall"; exit 1; }
          ls -la android/app/build/outputs/apk/*/*.apk

      - name: Report
        if: failure()
        run: |
          [ -f /tmp/build.log ] || exit 0
          grep -E "error:|FAILURE|What went wrong|Caused by|Could not|Execution failed|CMake Error|fatal error|undefined reference|multiple definition|duplicate symbol|Keystore|signingConfig|keyAlias|password" /tmp/build.log |
            head -30 | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
          # the tail says more than any pattern: the failing task and its cause are the last lines
          echo "----- the last lines of the build -----"
          tail -25 /tmp/build.log | cut -c1-300 | while IFS= read -r l; do echo "::error::tail: $l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: fpdc-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
