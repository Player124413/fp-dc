name: Android

# Builds the port, nothing else: the host-side checks and the APK itself. Testing happens on a real
# phone -- the app writes a log to <files>/fpdc.log that the launcher can copy (COPY LOG on the home
# screen, in the pause menu and on ABOUT).
# Only the DEBUG APK is built: it is signed with the same committed key as the release one was, so it
# installs over the previous build without an uninstall, and the symbols in it are what turns a crash
# address into a function name. A successful run leaves app-debug.apk in the 'fpdc-apk' artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK: '26.1.10909125'
  API: '34'

jobs:
  # ------------------------------------------------------------------------------------- host checks
  checks:
    name: Host checks (no NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Android sources, twiddle, font, shell
        run: |
          set -o pipefail
          make -C tools/android check 2>&1 | tee /tmp/check.log

      - name: Render every shell screen
        run: |
          set -o pipefail
          make -C tools/android preview 2>&1 | tee /tmp/preview.log
          ls tools/preview/out/*.png | wc -l

      - name: Report
        if: failure()
        run: |
          for f in /tmp/check.log /tmp/preview.log; do
            [ -f "$f" ] || continue
            grep -E "error|Error|FAILED|No such|cannot|undefined reference" "$f" | head -20 |
              while IFS= read -r l; do echo "::error::$l"; done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-screens
          path: tools/preview/out/*.png
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------------------------------- the APK
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only first-party actions plus plain shell: the runner image already ships the Android SDK.
      - name: Android SDK, NDK, CMake
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-$API" "build-tools;$API.0.0" \
                 "cmake;3.22.1" "ndk;$NDK" 2>&1 | tail -20
          echo "--- ndk:"; ls "$SDK/ndk" || true
          echo "--- cmake:"; ls "$SDK/cmake" || true
          echo "FP_NDK=$(ls "$SDK/ndk" | head -1)" >> $GITHUB_ENV

      - name: Gradle 8.7
        run: |
          set -o pipefail
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
          "$HOME/gradle-8.7/bin/gradle" --version | head -6

      - name: Build the APK (debug only)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          set -o pipefail
          gradle --no-daemon --warning-mode all -p android \
                 ${FP_NDK:+-PfpNdk=$FP_NDK} assembleDebug 2>&1 | tee /tmp/build.log

      - name: Check what went into the APK
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: ${BT:-MISSING}"
          fail=0
          for apk in android/app/build/outputs/apk/debug/app-debug.apk; do
            [ -f "$apk" ] || { echo "::error::$apk was not built"; fail=1; continue; }
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            unzip -l "$apk" | grep -E 'lib/.*/libfpdc\.so' || { echo "::error::the native library is missing from $apk"; fail=1; }
            # Every ABI in android/app/build.gradle must really be in the APK. armeabi-v7a is the 32-bit
            # one: without it the build installs on a 64-bit phone and is refused by an old 32-bit tablet
            # ("app not installed"), and gradle drops an ABI it failed to build silently.
            for abi in arm64-v8a armeabi-v7a x86_64; do
              if unzip -l "$apk" | grep -q "lib/$abi/libfpdc\.so"; then
                printf '  %-12s %s\n' "$abi" "$(unzip -p "$apk" "lib/$abi/libfpdc.so" | wc -c) bytes"
              else
                echo "::error::$abi is missing from $apk: a 32-bit device cannot install it"
                fail=1
              fi
            done
            # and it must be a 32-bit ELF, not a 64-bit file with a v7a name: that is what the 32-bit
            # devices dlopen, so the header is the only proof that the 32-bit path was built at all
            unzip -p "$apk" lib/armeabi-v7a/libfpdc.so > /tmp/v7a.so || true
            if [ -s /tmp/v7a.so ]; then
              if readelf -h /tmp/v7a.so | grep -q 'ELF32'; then
                echo "  armeabi-v7a is a 32-bit ELF: $(readelf -h /tmp/v7a.so | awk '/Machine:/{print $2, $3, $4}')"
              else
                echo "::error::lib/armeabi-v7a/libfpdc.so is not a 32-bit library"
                fail=1
              fi
            fi
            unzip -l "$apk" | grep -q 'classes.dex' || { echo "::error::no classes.dex in $apk"; fail=1; }
            # D-136: the Adventure scene scripts ship in the APK's assets (and win over the data pack), so their absence
            # is a broken build, not a cosmetic one: without them a device falls back to whatever script its pack has.
            nscn=$(unzip -l "$apk" | grep -c 'assets/story/.*\.scn$' || true)
            echo "  scene scripts in assets: $nscn"
            unzip -l "$apk" | grep -q 'assets/story/rm5_spade.scn' || { echo "::error::the scene scripts are missing from $apk (gradle storyAssets)"; fail=1; }
            [ "${nscn:-0}" -ge 60 ] || { echo "::error::only ${nscn:-0} scene scripts in $apk: the assets copy is incomplete"; fail=1; }
            # an update installs over the previous version only when the signature matches, so every
            # build must carry the same certificate -- the one in android/keystore
            if ! out=$("$BT/apksigner" verify --print-certs "$apk" 2>&1); then
              echo "::error::apksigner does not verify $apk: $(printf '%s' "$out" | tail -3 | tr '\n' ' ')"
              fail=1
            fi
            printf '%s\n' "$out" | grep -E "Verifies|SHA-256 digest" | head -3
            "$BT/aapt2" dump badging "$apk" 2>/dev/null | grep -E "^package: name|native-code" || true
          done
          # the build is signed with the committed key, the same one every run uses: that is what makes
          # an update install over the previous version instead of needing an uninstall
          certs=$("$BT/apksigner" verify --print-certs \
                    android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | grep "SHA-256 digest" | head -1)
          echo "----- signer -----"
          printf '%s\n' "$certs"
          [ -n "$certs" ] || { echo "::error::the APK is not signed: an update would need an uninstall"; fail=1; }
          n=$(ls android/app/build/outputs/apk/*/*.apk 2>/dev/null | wc -l)
          echo "APKs built: $n"
          ls -la android/app/build/outputs/apk/*/*.apk
          exit $fail

      - name: Report
        if: failure()
        run: |
          [ -f /tmp/build.log ] || exit 0
          grep -E "error:|FAILURE|What went wrong|Caused by|Could not|Execution failed|CMake Error|fatal error|undefined reference|multiple definition|duplicate symbol|Keystore|signingConfig|keyAlias|password" /tmp/build.log |
            head -30 | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
          # the tail says more than any pattern: the failing task and its cause are the last lines
          echo "----- the last lines of the build -----"
          tail -25 /tmp/build.log | cut -c1-300 | while IFS= read -r l; do echo "::error::tail: $l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: fpdc-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
